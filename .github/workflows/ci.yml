name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core package build (Java ${{ matrix.java }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, package, and check core integrations
        run: mvn -B -ntp -Dgpg.skip=true clean verify
      - name: Verify dictionary resources in the core JAR
        shell: bash
        run: |
          test -f target/linguamesh-core-1.0.0-SNAPSHOT-javadoc.jar
          for archive in target/linguamesh-core-1.0.0-SNAPSHOT.jar target/linguamesh-core-1.0.0-SNAPSHOT-sources.jar; do
            test -f "$archive"
            for resource in META-INF/LICENSE.txt META-INF/NOTICE.txt; do
              count=$(jar tf "$archive" | grep -Fxc "$resource" || true)
              if [ "$count" -ne 1 ]; then
                echo "Expected exactly one $resource in $archive; found $count"
                exit 1
              fi
            done
          done
          for resource in ansj_library.properties library/default.dic library/ambiguity.dic library/synonyms.dic library/stop.dic; do
            jar tf target/linguamesh-core-1.0.0-SNAPSHOT.jar | grep -Fxq "$resource" || exit 1
          done
          service=io.linguamesh.ansj.AnsjTokenizerProvider
          jar tf target/linguamesh-core-1.0.0-SNAPSHOT.jar | grep -Fxc "META-INF/services/io.linguamesh.api.TextTokenizerProvider" >/dev/null
          unzip -p target/linguamesh-core-1.0.0-SNAPSHOT.jar META-INF/services/io.linguamesh.api.TextTokenizerProvider | grep -Fxc "$service" | grep -Fxq 1
      - name: Validate Central publishing profile
        if: matrix.java == '21'
        run: mvn -B -ntp -Pcentral-publishing -Dgpg.skip=true -DskipTests validate

  icu4j-provider:
    name: ICU4J provider (Java 11)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Install the core artifact
        run: mvn -B -ntp -Dmaven.test.skip=true -Dgpg.skip=true install
      - name: Build, package, and check the ICU4J provider
        run: mvn -B -ntp -f providers/icu4j/pom.xml clean verify
      - name: Verify license and notice in the provider JAR
        run: |
          test -f providers/icu4j/target/linguamesh-provider-icu4j-1.0.0-SNAPSHOT-javadoc.jar
          for archive in providers/icu4j/target/linguamesh-provider-icu4j-1.0.0-SNAPSHOT.jar providers/icu4j/target/linguamesh-provider-icu4j-1.0.0-SNAPSHOT-sources.jar; do
            test -f "$archive"
            for resource in META-INF/LICENSE.txt META-INF/NOTICE.txt; do
              count=$(jar tf "$archive" | grep -Fxc "$resource" || true)
              if [ "$count" -ne 1 ]; then
                echo "Expected exactly one $resource in $archive; found $count"
                exit 1
              fi
            done
          done
          unzip -p providers/icu4j/target/linguamesh-provider-icu4j-1.0.0-SNAPSHOT.jar META-INF/services/io.linguamesh.api.TextTokenizerProvider | grep -Fxc io.linguamesh.icu4j.Icu4jTokenizerProvider | grep -Fxq 1
      - name: Validate Central publishing profile
        run: mvn -B -ntp -Pcentral-publishing -Dgpg.skip=true -DskipTests -f providers/icu4j/pom.xml validate

