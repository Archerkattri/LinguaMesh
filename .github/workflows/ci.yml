name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package core
        run: mvn -B -ntp -Dgpg.skip=true clean verify
      - name: Validate Central publishing profile
        if: matrix.java == '21'
        run: mvn -B -ntp -Pcentral-publishing -Dgpg.skip=true -DskipTests validate

  icu4j-provider:
    name: ICU4J provider (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Install the core and run its tests
        run: mvn -B -ntp -Dgpg.skip=true install
      - name: Test and package the ICU4J provider
        run: mvn -B -ntp -f providers/icu4j/pom.xml clean verify

  lucene10-provider:
    name: Lucene 10 provider (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the core and run its tests
        run: mvn -B -ntp -Dgpg.skip=true install
      - name: Test and package the Lucene 10 provider
        run: mvn -B -ntp -f providers/lucene10/pom.xml clean verify

  opennlp-provider:
    name: OpenNLP provider (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install the core and run its tests
        run: mvn -B -ntp -Dgpg.skip=true install
      - name: Test and package the OpenNLP provider
        run: mvn -B -ntp -f providers/opennlp/pom.xml clean verify
