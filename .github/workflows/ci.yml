  sudachi-provider:
    name: Sudachi provider (Java 8)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Download the pinned Sudachi V1 test dictionary
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sudachi-dictionary-20260723-v1-core.zip"
          directory="$RUNNER_TEMP/sudachi-dictionary"
          curl --fail --location --retry 3 --output "$archive" \
            https://sudachi.s3.ap-northeast-1.amazonaws.com/sudachidict/v1/sudachi-dictionary-20260723-core.zip
          echo "9dd45e5b730a3e7b282267a951d083dbd73ddf9323355a90d0ae05dfd2c0a18d  $archive" | sha256sum --check --status
          mkdir -p "$directory"
          unzip -q "$archive" -d "$directory"
          dictionary=$(find "$directory" -type f -name system_core.dic -print -quit)
          test -n "$dictionary"
          echo "SUDACHI_DICTIONARY_PATH=$dictionary" >> "$GITHUB_ENV"
      - name: Install the core artifact
        run: mvn -B -ntp -Dmaven.test.skip=true -Dgpg.skip=true install
      - name: Build, package, and check the Sudachi provider
        run: mvn -B -ntp -f providers/sudachi/pom.xml clean verify
      - name: Verify license and notice in the provider JAR
        shell: bash
        run: |
          test -f providers/sudachi/target/linguamesh-provider-sudachi-1.0.0-SNAPSHOT-javadoc.jar
          for archive in providers/sudachi/target/linguamesh-provider-sudachi-1.0.0-SNAPSHOT.jar providers/sudachi/target/linguamesh-provider-sudachi-1.0.0-SNAPSHOT-sources.jar; do
            test -f "$archive"
            for resource in META-INF/LICENSE.txt META-INF/NOTICE.txt; do
              count=$(jar tf "$archive" | grep -Fxc "$resource" || true)
              if [ "$count" -ne 1 ]; then
                echo "Expected exactly one $resource in $archive; found $count"
                exit 1
              fi
            done
          done
          unzip -p providers/sudachi/target/linguamesh-provider-sudachi-1.0.0-SNAPSHOT.jar META-INF/services/io.linguamesh.api.TextTokenizerProvider | grep -Fxc io.linguamesh.sudachi.SudachiTokenizerProvider | grep -Fxq 1
      - name: Validate Central publishing profile
        run: mvn -B -ntp -Pcentral-publishing -Dgpg.skip=true -DskipTests -f providers/sudachi/pom.xml validate
